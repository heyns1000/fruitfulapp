services:
  web:
    image: node:22-slim
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      # Vite appends this to its dev-server host allowlist (Vite >= 6.1).
      # The platform sets it; needed so the preview's external host is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      # Placeholders first, platform-delivered secrets last so they always win.
      - ./.env.base44-defaults
      - /run/base44/app.env
    # Do NOT set MODAL_SANDBOX_ID: @base44/vite-plugin treats it as "running in
    # the Base44 sandbox" and then configures host/port WITHOUT the /api proxy.
    # Without it, the plugin's normal path proxies /api -> VITE_BASE44_APP_BASE_URL.
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)throw 0}).catch(()=>{throw 1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
